name: Daat Agente - compilar APK

# Compila la app Android de la carpeta daat-agente/ y publica el APK
# en Releases con un enlace fijo de descarga.
on:
  push:
    paths:
      - "daat-agente/**"
      - ".github/workflows/daat-agente-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daat-agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleSeguraDebug assembleCompletaDebug
      - run: |
          cp app/build/outputs/apk/segura/debug/app-segura-debug.apk DaatAgente.apk
          cp app/build/outputs/apk/completa/debug/app-completa-debug.apk DaatAgente-completa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DaatAgente-apk
          path: |
            daat-agente/DaatAgente.apk
            daat-agente/DaatAgente-completa.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: daat-agente-latest
          name: Daat Agente (última versión)
          make_latest: true
          files: |
            daat-agente/DaatAgente.apk
            daat-agente/DaatAgente-completa.apk
